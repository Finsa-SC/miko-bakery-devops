<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Miko Bakery</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="navbar">

    <div class="brand">
        <h1>Miko Bakery</h1>
        <span>Fresh every morning</span>
    </div>

    <nav>
        <a href="/">Dashboard</a>
        <a href="#">Orders</a>
        <a href="#">Cart</a>
    </nav>

    <div class="utilities">
        <button id="refresh-button">Refresh</button>
    </div>

</header>


<main class="container">

    <section class="hero">
        <div>
            <p class="eyebrow">TODAY'S MENU</p>
            <h2>Good morning ☕</h2>
            <p>
                Fresh bread, pastries, and drinks for your morning.
            </p>
        </div>
    </section>


    <section class="catalog">

        <div class="catalog-header">
            <div>
                <h2>Our Products</h2>
                <p id="product-count">Loading...</p>
            </div>
        </div>


        <form id="filter-form" class="filters">

            <input
                type="search"
                id="search"
                placeholder="Search products..."
            >

            <input
                type="number"
                id="price-below"
                placeholder="Max price"
                min="0"
            >

            <button type="submit">
                Search
            </button>

            <button
                type="button"
                id="reset-button"
            >
                Reset
            </button>

        </form>


        <div id="products" class="products">
            <!-- Products generated by JavaScript -->
        </div>

    </section>

</main>


<script src="/js/products.js"></script>

</body>
</html>
