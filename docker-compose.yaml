services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    networks:
      - miko-network

  api:
    build: ./app
    networks:
      - miko-network

  front-end:
    build: ./web
    networks:
      - miko-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - miko-network

  postgres:
    image: postgres:17
    container_name: miko-bakery-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - miko-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:

networks:
  miko-network:
    driver: bridge